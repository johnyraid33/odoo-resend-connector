name: odoo-resend-dev19

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - odoo19-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8070:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo19-data:/var/lib/odoo
      - ./odoo19.conf:/etc/odoo/odoo.conf:ro
      - ../rex_resend_connector:/mnt/extra-addons/rex_resend_connector
    command: ["odoo", "--addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons"]

volumes:
  odoo19-db-data:
  odoo19-data:
